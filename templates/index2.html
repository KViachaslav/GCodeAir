<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GRBL Web Streamer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .status-card { font-size: 1.2rem; font-weight: bold; }
        .buffer-indicator { width: 20px; height: 20px; display: inline-block; border-radius: 50%; background: #ccc; margin-right: 5px; }
        .buffer-active { background: #0d6efd; }
        /* Стиль для консоли */
        #consoleLog {
            background: #212529;
            color: #0dfd05;
            font-family: 'Courier New', Courier, monospace;
            height: 250px;
            overflow-y: auto;
            padding: 10px;
            font-size: 0.9rem;
            border-radius: 5px;
        }
        .log-entry { border-bottom: 1px solid #333; margin-bottom: 2px; }
    </style>
</head>
<body class="bg-light">
<div class="container py-4">
    <h2 class="mb-4">GRBL Streamer + Console</h2>
    
    <div class="row">
        <!-- Левая колонка: Ввод -->
        <div class="col-md-5">
            <div class="card p-3 shadow-sm mb-3">
                <textarea id="gcodeArea" class="form-control mb-2" rows="8" placeholder="G-код..."></textarea>
                <input type="file" id="fileInput" class="form-control mb-3">
                <div class="d-flex gap-2">
                    <button id="startBtn" class="btn btn-success w-100">ПУСК</button>
                    <button id="stopBtn" class="btn btn-danger">СТОП</button>
                </div>
            </div>
        </div>

        <!-- Правая колонка: Статус и Консоль -->
        <div class="col-md-7">
            <div class="card p-3 shadow-sm">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span id="lblStatus" class="badge bg-secondary p-2">Idle</span>
                    <div id="bufferDots">
                        <small class="text-muted me-2">Buffer:</small>
                        <div class="buffer-indicator" id="dot1"></div>
                        <div class="buffer-indicator" id="dot2"></div>
                        <div class="buffer-indicator" id="dot3"></div>
                    </div>
                </div>

                <div class="progress mb-3" style="height: 10px;">
                    <div id="progressBar" class="progress-bar" style="width: 0%"></div>
                </div>

                <h6 class="text-muted">Консоль ответов GRBL:</h6>
                <div id="consoleLog">
                    <!-- Сюда будут падать ответы -->
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Загрузка файла
    document.getElementById('fileInput').addEventListener('change', function(e) {
        let reader = new FileReader();
        reader.onload = (e) => document.getElementById('gcodeArea').value = e.target.result;
        reader.readAsText(e.target.files[0]);
    });

    // Запуск
    document.getElementById('startBtn').addEventListener('click', function() {
        let formData = new FormData();
        formData.append('gcode', document.getElementById('gcodeArea').value);
        fetch('/upload', { method: 'POST', body: formData });
    });

    // Стоп
    document.getElementById('stopBtn').addEventListener('click', () => fetch('/stop', { method: 'POST' }));

    // Обновление статуса и консоли
    setInterval(() => {
        fetch('/status')
        .then(res => res.json())
        .then(data => {
            // Обновляем текст статуса и прогресс
            document.getElementById('lblStatus').innerText = data.status;
            let percent = data.total_lines > 0 ? (data.sent_lines / data.total_lines) * 100 : 0;
            document.getElementById('progressBar').style.width = percent + "%";

            // Обновляем буфер (точки)
            for(let i=1; i<=3; i++) {
                document.getElementById('dot'+i).classList.toggle('buffer-active', data.buffer_slots >= i);
            }

            // Обновляем консоль
            const consoleDiv = document.getElementById('consoleLog');
            // Генерируем HTML для строк лога
            const logHtml = data.console_log.map(line => `<div class="log-entry">${line}</div>`).join('');
            
            // Если содержимое изменилось, обновляем и скроллим вниз
            if (consoleDiv.innerHTML !== logHtml) {
                consoleDiv.innerHTML = logHtml;
                consoleDiv.scrollTop = consoleDiv.scrollHeight;
            }
        });
    }, 200);
</script>
</body>
</html>
