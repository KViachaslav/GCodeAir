<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRBL Web Streamer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .status-card { font-size: 1.1rem; font-weight: bold; }
        .buffer-indicator { width: 20px; height: 20px; display: inline-block; border-radius: 50%; background: #dee2e6; margin-right: 5px; transition: 0.2s; }
        .buffer-active { background: #0d6efd; box-shadow: 0 0 8px rgba(13, 110, 253, 0.5); }
        #logWindow { 
            height: 250px; 
            overflow-y: auto; 
            background: #1e1e1e; 
            color: #4af626; 
            padding: 15px; 
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .log-entry { border-bottom: 1px solid #2a2a2a; padding: 2px 0; }
        .log-entry:last-child { border-bottom: none; }
    </style>
</head>
<body class="bg-light">
<div class="container py-4">
    <h3 class="mb-4 text-center">GRBL Streaming Console</h3>
    
    <div class="row g-4">
        <!-- Левая панель: Управление -->
        <div class="col-lg-6">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title">Загрузка G-Code</h5>
                    <textarea id="gcodeArea" class="form-control mb-3" rows="12" placeholder="G0 X10 Y10..."></textarea>
                    
                    <div class="mb-3">
                        <label class="form-label small">Выбрать файл (.nc, .gcode)</label>
                        <input type="file" id="fileInput" class="form-control form-control-sm" accept=".nc,.gcode,.txt">
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button id="startBtn" class="btn btn-primary flex-grow-1">ЗАПУСТИТЬ</button>
                        <button id="stopBtn" class="btn btn-outline-danger">СТОП</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Правая панель: Статус и Логи -->
        <div class="col-lg-6">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title">Мониторинг</h5>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span id="lblStatus" class="badge bg-secondary p-2 status-card">Idle</span>
                        <div id="bufferDots">
                            <span class="small text-muted me-2">Buffer:</span>
                            <div class="buffer-indicator" id="dot1"></div>
                            <div class="buffer-indicator" id="dot2"></div>
                            <div class="buffer-indicator" id="dot3"></div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between small mb-1">
                            <span>Прогресс: <strong id="lblProgress">0 / 0</strong></span>
                            <span id="lblCurrentCmd" class="text-primary fw-bold">-</span>
                        </div>
                        <div class="progress" style="height: 10px;">
                            <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
                        </div>
                    </div>

                    <h6 class="mt-4 mb-2 small text-uppercase fw-bold text-muted">Консоль GRBL:</h6>
                    <div id="logWindow">
                        <div id="logContent"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let lastLogCount = 0;

    // Чтение файла
    document.getElementById('fileInput').addEventListener('change', function(e) {
        let file = e.target.files[0];
        if (!file) return;
        let reader = new FileReader();
        reader.onload = (e) => document.getElementById('gcodeArea').value = e.target.result;
        reader.readAsText(file);
    });

    // Запуск
    document.getElementById('startBtn').addEventListener('click', function() {
        let gcode = document.getElementById('gcodeArea').value;
        if(!gcode.trim()) return alert("Введите G-код");

        let formData = new FormData();
        formData.append('gcode', gcode);

        fetch('/upload', { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => { if(data.error) alert(data.error); });
    });

    // Стоп
    document.getElementById('stopBtn').addEventListener('click', () => fetch('/stop', { method: 'POST' }));

    // Цикл обновления
    setInterval(() => {
        fetch('/status')
        .then(res => res.json())
        .then(data => {
            // Обновление текста статуса
            const statusEl = document.getElementById('lblStatus');
            statusEl.innerText = data.status;
            statusEl.className = `badge status-card ${data.status === 'Streaming' ? 'bg-primary' : data.status === 'Finished' ? 'bg-success' : 'bg-danger'}`;
            
            // Прогресс и команда
            document.getElementById('lblCurrentCmd').innerText = data.current_command || "Wait...";
            document.getElementById('lblProgress').innerText = `${data.sent_lines} / ${data.total_lines}`;
            let percent = data.total_lines > 0 ? (data.sent_lines / data.total_lines) * 100 : 0;
            document.getElementById('progressBar').style.width = percent + "%";

            // Индикация буфера
            for(let i=1; i<=3; i++) {
                document.getElementById('dot'+i).classList.toggle('buffer-active', data.buffer_slots >= i);
            }

            // Обновление логов
            if (data.logs && data.logs.length !== lastLogCount) {
                const logContent = document.getElementById('logContent');
                const logWindow = document.getElementById('logWindow');
                
                logContent.innerHTML = data.logs.map(line => `<div class="log-entry">> ${line}</div>`).join('');
                
                // Скролл вниз если лог обновился
                logWindow.scrollTop = logWindow.scrollHeight;
                lastLogCount = data.logs.length;
            }
        });
    }, 200);
</script>
</body>
</html>
