<!DOCTYPE html>
<html>
<head>
    <title>CNC Control Panel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: #2c3e50; color: white; }
        #console { height: 350px; overflow-y: auto; background: #1e1e1e; color: #00ff00; padding: 15px; border-radius: 8px; margin-bottom: 15px; font-family: 'Consolas', monospace; border: 1px solid #444; }
        textarea { width: 100%; height: 150px; background: #34495e; color: white; border: 1px solid #555; border-radius: 5px; padding: 10px; font-family: monospace; resize: vertical; }
        .controls { margin-top: 10px; display: flex; gap: 10px; }
        button { padding: 10px 25px; cursor: pointer; border: none; border-radius: 4px; background: #3498db; color: white; font-weight: bold; }
        button:hover { background: #2980b9; }
        button.clear { background: #e74c3c; }
    </style>
</head>
<body>

    <h2>CNC Terminal</h2>
    <div id="console"></div>
    
    <textarea id="gcodeBlock" placeholder="Вставьте блок G-кода здесь...&#10;G1 X10&#10;G1 Y10&#10;M30"></textarea>
    
    <div class="controls">
        <button onclick="sendBlock()">Выполнить блок</button>
        <button class="clear" onclick="clearConsole()">Очистить консоль</button>
        <button onclick="sendSingle('?')">Статус (?)</button>
        <button onclick="sendSingle('$X')">Разблокировка ($X)</button>
    </div>

    <script>
        const socket = new WebSocket('ws://192.168.100.58:81'); // Динамический IP, если HTML на ESP
        //Если запускаете файл с ПК, замените на: new WebSocket('ws://192.168.1.100:81');
        
        let queue = [];
        let isWaiting = false;

        socket.onmessage = function(event) {
            const msg = event.data.trim();
            if (!msg) return;

            logToConsole("<- " + msg);

            // Снимаем блокировку, если в строке есть "ok"
            // В grblHAL статус часто приходит в одной строке с ok: <...|...> ok
            if (msg.toLowerCase().includes("ok")) {
                isWaiting = false;
                processQueue();
            }
        };

        function logToConsole(text) {
            const con = document.getElementById('console');
            const entry = document.createElement('div');
            entry.textContent = text;
            con.appendChild(entry);
            con.scrollTop = con.scrollHeight;
        }

        function sendBlock() {
            const area = document.getElementById('gcodeBlock');
            const lines = area.value.split('\n');
            
            lines.forEach(line => {
                const trimmed = line.trim();
                if (trimmed) queue.push(trimmed);
            });

            area.value = ''; // Очищаем поле после добавления в очередь
            processQueue();
        }

        function sendSingle(cmd) {
            queue.push(cmd);
            processQueue();
        }

        function processQueue() {
            if (queue.length > 0 && !isWaiting) {
                const nextCmd = queue.shift();
                
                // Для "?" обычно не ждут "ok", но grblHAL может присылать его в конце строки.
                // Если очередь "зависает" на вопросе, можно добавить: if (nextCmd !== '?') isWaiting = true;
                isWaiting = true; 
                
                logToConsole("-> " + nextCmd);
                socket.send(nextCmd);
            }
        }

        function clearConsole() {
            document.getElementById('console').innerHTML = '';
        }

        socket.onopen = () => logToConsole("--- Connected to ESP8266 ---");
        socket.onclose = () => logToConsole("--- Disconnected ---");
    </script>



</body>
</html>
